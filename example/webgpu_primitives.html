<html>
	<head>
		<title>Basic Primitives Path Tracing Example</title>
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

		<style>
			html, body {
				margin: 0;
				padding: 0;
				background-color: #eee;
			}

			#info {
				position: absolute;
				bottom: 0;
				left: 1020px;
				font-family: 'Courier New', Courier, monospace;
				color: black;
				pointer-events: none;
			}

			#samples, #credits {

				opacity: 0.5;
				background-color: rgba( 0.0, 0.0, 0.0, 0.5 );
				padding: 5px;
				display: inline-block;

			}

			#corner-canvas {
				position: fixed;
				bottom: 0;
				left: 0;
				max-width: 500px;
				max-height: 200px;
				z-index: 1000;
			}

			#histogram {
				position: fixed;
				bottom: 0;
				left: 510;
				max-width: 500px;
				max-height: 200px;
				z-index: 1000;
			}
		</style>

	</head>
	<body>
		<canvas id="corner-canvas" width="200" height="300"></canvas>
		<canvas id="histogram" width="200" height="300"></canvas>
		<p id="info">Sample text</p>
		<script src="./webgpu_primitives.js" type="module"></script>
	</body>
</html>
