<!DOCTYPE html>
<html>
	<head>
		<title>EON Diffuse Comparison</title>
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
		<style>
			html, body {
				margin: 0;
				height: 100%;
				background: #101216;
				color: #e7e9ee;
				font: 13px system-ui, sans-serif;
			}

			body {
				display: grid;
				grid-template-rows: auto 1fr;
				overflow: hidden;
			}

			.toolbar {
				min-height: 48px;
				display: flex;
				align-items: center;
				gap: 22px;
				padding: 0 16px;
				box-sizing: border-box;
				border-bottom: 1px solid #2a2e36;
				background: #171a20;
			}

			.title {
				font-weight: 600;
				white-space: nowrap;
			}

			.control {
				display: flex;
				align-items: center;
				gap: 8px;
				white-space: nowrap;
			}

			.control input[type="range"] {
				width: 130px;
			}

			.control output {
				min-width: 42px;
				color: #aeb5c2;
				font-variant-numeric: tabular-nums;
			}

			input[type="color"] {
				width: 28px;
				height: 22px;
				padding: 0;
				border: 1px solid #4a515e;
				background: transparent;
			}

			#samples {
				margin-left: auto;
				color: #8e97a6;
				font-variant-numeric: tabular-nums;
			}

			#stage {
				position: relative;
				min-height: 0;
				overflow: hidden;
			}

			.comparison-canvas {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
			}

			#labels {
				position: absolute;
				inset: 0;
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				grid-template-rows: repeat(2, 1fr);
				pointer-events: none;
				z-index: 1;
			}

			#labels > div {
				padding: 14px;
				border-left: 1px solid rgba(255, 255, 255, 0.16);
				text-shadow: 0 1px 3px #000;
			}

			#labels > div:first-child {
				border-left: 0;
			}

			#labels > div:nth-child(4) {
				border-left: 0;
			}

			#labels > div:nth-child(n+4) {
				border-top: 1px solid rgba(255, 255, 255, 0.16);
			}

			.algorithm {
				font-size: 15px;
				font-weight: 600;
			}

			.reference {
				margin-top: 3px;
				color: #aeb5c2;
				font-size: 11px;
			}

			.lighting {
				margin-bottom: 4px;
				color: #d0a875;
				font-size: 10px;
				font-weight: 600;
				text-transform: uppercase;
			}

			@media ( max-width: 760px ) {

				.toolbar {
					gap: 10px;
					padding: 8px 10px;
					flex-wrap: wrap;
				}

				#samples {
					margin-left: 0;
				}

				.control input[type="range"] {
					width: 90px;
				}

			}
		</style>
	</head>
	<body>
		<header class="toolbar">
			<div class="title">EON Diffuse Comparison</div>
			<label class="control">roughness
				<input id="diffuse-roughness" type="range" min="0" max="1" step="0.01">
				<output id="diffuse-roughness-value">1.00</output>
			</label>
			<label class="control">side-light angle
				<input id="light-angle" type="range" min="0" max="85" step="1">
				<output id="light-angle-value">75 deg</output>
			</label>
			<label class="control">albedo <input id="albedo" type="color" value="#e0e0e0"></label>
			<div id="samples">0 spp</div>
		</header>
		<main id="stage">
			<div id="labels">
				<div><div class="lighting">front-lit</div><div class="algorithm">Lambert</div><div class="reference">cosine diffuse</div></div>
				<div><div class="lighting">front-lit</div><div class="algorithm">FON</div><div class="reference">single scatter</div></div>
				<div><div class="lighting">front-lit</div><div class="algorithm">EON</div><div class="reference">energy preserving</div></div>
				<div><div class="lighting">side-lit</div><div class="algorithm">Lambert</div><div class="reference">cosine diffuse</div></div>
				<div><div class="lighting">side-lit</div><div class="algorithm">FON</div><div class="reference">single scatter</div></div>
				<div><div class="lighting">side-lit</div><div class="algorithm">EON</div><div class="reference">energy preserving</div></div>
			</div>
		</main>
		<script type="module" src="./eonComparison.js"></script>
	</body>
</html>
