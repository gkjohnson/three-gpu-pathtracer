<!DOCTYPE html>
<html>
	<head>
		<title>PBR Path Tracing - LDraw Models</title>
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

		<style>
			html, body {
				margin: 0;
				padding: 0;
				background-color: #111;
			}

			.checkerboard {
				background-image:
					linear-gradient(45deg, #222 25%, transparent 25%),
					linear-gradient(-45deg, #222 25%, transparent 25%),
					linear-gradient(45deg, transparent 75%, #222 75%),
					linear-gradient(-45deg, transparent 75%, #222 75%);
				background-size: 20px 20px;
				background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
			}
		</style>

	</head>
	<body>
		<script type="module">

			function mecaBricksGoldCorrection( model ) {

				model.traverse( c => {

					if ( c.material ) {

						if ( c.material.color.getHexString() === '7f4c0e' ) {

							c.material.color.set( 0xc2801f ).multiplyScalar( 0.9 );
							c.material.roughness = 0.45;
							c.material.metalness = 0.6;

						} else if ( c.material.color.getHexString() === '613708' )  {

							c.material.color.set( 0xc2801f );
							c.material.color.g *= 0.75;
							c.material.color.b *= 0.75;
							c.material.roughness = 0.45;
							c.material.metalness = 0.6;

						}

					}

				} );

			}

			const MODEL_LIST = {

				'LEGO UCS AT-ST': {
					opacityToTransmission: true,
					ior: 1.4,
					url: 'https://raw.githubusercontent.com/mrdoob/three.js/r150/examples/models/ldraw/officialLibrary/models/10174-1-ImperialAT-ST-UCS.mpd_Packed.mpd',
				},

				'LEGO Lunar Vehicle': {
					opacityToTransmission: true,
					ior: 1.4,
					url: 'https://raw.githubusercontent.com/mrdoob/three.js/r150/examples/models/ldraw/officialLibrary/models/1621-1-LunarMPVVehicle.mpd_Packed.mpd',
					rotation: [ Math.PI, - Math.PI / 2, 0 ],
				},

				'LEGO NASA Mars Rover': {
					url: 'https://raw.githubusercontent.com/gkjohnson/3d-demo-data/main/models/mecabricks/nasa-mars-curiosity-rover.dae',
					postProcess: mecaBricksGoldCorrection,
					credit: 'Model courtesy of <a href="https://mecabricks.com/">MecaBricks library</a>.',
				},

				'LEGO Apollo 11 Lander': {
					url: 'https://raw.githubusercontent.com/gkjohnson/3d-demo-data/main/models/mecabricks/apollo-11-lunar-lander/lunar-lander.dae',
					postProcess: mecaBricksGoldCorrection,
					credit: 'Model courtesy of <a href="https://mecabricks.com/">MecaBricks library</a>.',
				},

				'LEGO Imperial Star Destroyer - UCS': {
					opacityToTransmission: true,
					ior: 1.4,
					url: 'https://raw.githubusercontent.com/gkjohnson/ldraw-parts-library/master/models/10030-1 - Imperial Star Destroyer - UCS.mpd',
				},

				'LEGO Millennium Falcon - UCS': {
					opacityToTransmission: true,
					ior: 1.4,
					url: 'https://raw.githubusercontent.com/gkjohnson/ldraw-parts-library/master/models/10179-1 - Millennium Falcon - UCS.mpd',
				},

				'LEGO B-wing Starfighter': {
					opacityToTransmission: true,
					ior: 1.4,
					url: 'https://raw.githubusercontent.com/gkjohnson/ldraw-parts-library/master/models/10227-1 - B-wing Starfighter.mpd',
				},

				'LEGO Ice Tunnelator': {
					opacityToTransmission: true,
					ior: 1.4,
					url: 'https://raw.githubusercontent.com/gkjohnson/ldraw-parts-library/master/models/6814-1 - Ice Tunnelator.mpd',
				},

				'LEGO Super Model Building Instruction': {
					opacityToTransmission: true,
					ior: 1.4,
					url: 'https://raw.githubusercontent.com/gkjohnson/ldraw-parts-library/master/models/6861-2 - Super Model Building Instruction.mpd',
				},

				'LEGO Blizzard Baron': {
					opacityToTransmission: true,
					ior: 1.4,
					url: 'https://raw.githubusercontent.com/gkjohnson/ldraw-parts-library/master/models/6879-1 - Blizzard Baron.mpd',
				},

				'LEGO Allied Avenger': {
					opacityToTransmission: true,
					ior: 1.4,
					url: 'https://raw.githubusercontent.com/gkjohnson/ldraw-parts-library/master/models/6887-1 - Allied Avenger.mpd',
				},

				'LEGO Stellar Recon Voyager': {
					opacityToTransmission: true,
					ior: 1.4,
					url: 'https://raw.githubusercontent.com/gkjohnson/ldraw-parts-library/master/models/6956-1 - Stellar Recon Voyager.mpd',
				},

				'LEGO Ice Station Odyssey': {
					opacityToTransmission: true,
					ior: 1.4,
					url: 'https://raw.githubusercontent.com/gkjohnson/ldraw-parts-library/master/models/6983-1 - Ice Station Odyssey.mpd',
				},

				'LEGO Bennys Spaceship': {
					opacityToTransmission: true,
					ior: 1.4,
					url: 'https://raw.githubusercontent.com/gkjohnson/ldraw-parts-library/master/models/70816 - Bennys Spaceship Spa_kOdSy6E.mpd',
				},

				'LEGO TIE Interceptor - UCS': {
					opacityToTransmission: true,
					ior: 1.4,
					url: 'https://raw.githubusercontent.com/gkjohnson/ldraw-parts-library/master/models/7181 - TIE Interceptor - UCS.mpd',
				},

				'LEGO X-wing Fighter - UCS': {
					opacityToTransmission: true,
					ior: 1.4,
					url: 'https://raw.githubusercontent.com/gkjohnson/ldraw-parts-library/master/models/7191 - X-wing Fighter - UCS.mpd',
				},

			};

			for ( const key in MODEL_LIST ) {

				const info = MODEL_LIST[ key ];
				if ( ! info.credit ) {

					info.credit = 'Model courtesy of the <a href="https://omr.ldraw.org/">LDraw Official Model Repository and Parts Library</a>.';

				}

			}

			window.MODEL_LIST = MODEL_LIST;
		</script>
		<script src="./index.js" type="module"></script>
	</body>
</html>
